name: assets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Package docs and screenshots
        run: |
          flutter pub get
          flutter test --update-goldens test/screenshot_test.dart
          mkdir -p dist/aperture-assets/screenshots
          cp README.md SPEC.md dist/aperture-assets/
          cp test/goldens/*.png dist/aperture-assets/screenshots/
          tar -C dist -czf aperture-assets.tar.gz aperture-assets
      - uses: actions/upload-artifact@v4
        with:
          name: aperture-assets
          path: aperture-assets.tar.gz
          if-no-files-found: error
      - name: Attach release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: aperture-assets.tar.gz
